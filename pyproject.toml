[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyr"
version = "0.1.0"
description = "Living knowledge layers — transform evolving information into layered, traceable, continuously-maintained knowledge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ruxiz" }]
keywords = ["ai", "knowledge", "memory", "provenance", "layered", "rag", "anthropic", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/canis-minor/lyr"
Repository = "https://github.com/canis-minor/lyr"
Issues = "https://github.com/canis-minor/lyr/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.34", "openai>=1.40"]

[tool.setuptools.packages.find]
include = ["lyr*"]
exclude = ["tests*", "explorer*"]

[tool.setuptools.package-data]
"lyr.durable" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
