<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYR — Judgment Explorer</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#fff; --ink:#1a1a1f; --muted:#6b7280; --line:#e5e7eb;
    --keep:#15803d; --keep-bg:#dcfce7; --reject:#b91c1c; --reject-bg:#fee2e2;
    --unsure:#a16207; --unsure-bg:#fef9c3; --noop:#6b7280; --noop-bg:#f1f5f9;
    --accent:#4f46e5;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e0f13; --panel:#171922; --ink:#e8e8ee; --muted:#9aa0ac; --line:#282b36;
      --keep:#4ade80; --keep-bg:#0f2f1c; --reject:#f87171; --reject-bg:#3a1414;
      --unsure:#fbbf24; --unsure-bg:#3a2f0a; --noop:#9aa0ac; --noop-bg:#20232c; --accent:#a5b4fc; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:22px 24px 8px}
  h1{font-size:20px;margin:0}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:16px 24px 48px;align-items:start}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  /* sidebar */
  .list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:12px}
  .list h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:0;padding:12px 14px 6px}
  .item{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;cursor:pointer;
    padding:9px 14px;border-top:1px solid var(--line);font:inherit;display:flex;gap:8px;align-items:flex-start}
  .item:hover{background:var(--bg)}
  .item.active{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
  .item .s{font-size:12.5px;line-height:1.35}
  .item .d{font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  /* verdict pill */
  .pill{flex:0 0 auto;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;letter-spacing:.03em;margin-top:1px}
  .KEEP{color:var(--keep);background:var(--keep-bg)} .REJECT{color:var(--reject);background:var(--reject-bg)}
  .UNSURE{color:var(--unsure);background:var(--unsure-bg)} .NONE{color:var(--noop);background:var(--noop-bg)}
  /* lifecycle */
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
  .stage>summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
  .stage>summary::-webkit-details-marker{display:none}
  .stage>summary .tag{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;flex:0 0 84px}
  .stage>summary .h{flex:1}
  .stage>summary .chev{color:var(--muted);transition:transform .15s}
  .stage[open]>summary .chev{transform:rotate(90deg)}
  .body{padding:2px 16px 16px 16px}
  .arrow{text-align:center;color:var(--muted);font-size:15px;margin:-4px 0 6px}
  .stmt{font-size:16px;font-weight:600;margin:6px 0}
  .op{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--noop-bg);color:var(--ink);letter-spacing:.04em}
  .kv{color:var(--muted);font-size:12.5px;margin:6px 0 0}
  .kv b{color:var(--ink);font-weight:600}
  .chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:6px 9px;margin:4px 6px 0 0;font-size:12.5px}
  .chip .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-right:5px}
  .grp{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:12.5px;color:var(--muted)}
  .rationale{background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13.5px}
  .verdictbig{font-size:15px;font-weight:700;padding:3px 10px;border-radius:20px}
  .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;max-width:180px;margin-top:4px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .outcome{border-radius:12px;padding:14px 16px;font-weight:600}
  .outcome.yes{background:var(--keep-bg);color:var(--keep)}
  .outcome.no{background:var(--noop-bg);color:var(--muted)}
  .note{color:var(--muted);font-size:12px;margin-top:6px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>LYR — Judgment Explorer</h1>
  <p>The lifecycle of one durable judgment: what evidence existed, what the Builder proposed,
     how the Verifier judged it, and what the Engine committed. Real
     <code>JudgmentRecord</code>s from the M3.1-C.1 verified run — read-only.</p>
</header>
<div class="wrap">
  <nav class="list" id="list"><h2>Judgments</h2></nav>
  <main id="main"></main>
</div>

<script src="data.js"></script>
<script>
const R = (window.LYR_RECORDS || []);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => (s==null?"":String(s)).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const verdictOf = r => r.verifier ? (r.verifier.status==="ERROR"?"ERROR":r.verifier.decision) : "NONE";

function stage(tag, head, bodyHtml, open){
  const d = el("details","stage"); if(open) d.open = true;
  const s = el("summary"); s.append(el("span","tag",tag), el("span","h",head), el("span","chev","›"));
  d.append(s, el("div","body",bodyHtml));
  return d;
}
const arrow = () => el("div","arrow","↓");

function render(r){
  const m = document.getElementById("main"); m.innerHTML="";
  const conf = c => c==null?"":`<div class="bar"><i style="width:${Math.round(c*100)}%"></i></div><div class="note">confidence ${c}</div>`;

  // Evidence
  const evChips = r.evidence.map(e=>`<span class="chip"><span class="k">${esc(e.kind)}</span>${esc(e.label)}</span>`).join("") || '<span class="note">(none)</span>';
  const grps = r.evidence_groups.map(g=>`<div class="grp">${g.same_observation?"● one observation":"○ independent"}: ${g.members.map(esc).join(" · ")}${g.note?`<br><i>${esc(g.note)}</i>`:""}</div>`).join("");
  m.append(stage("Evidence", `${r.evidence.length} semantic record(s) · ${esc(r.domain_title)}`,
    evChips + grps, true), arrow());

  // Builder
  const b=r.builder;
  m.append(stage("Builder", "proposed a durable operation",
    `<span class="op">${esc(b.operation)}</span> &nbsp;<span class="kv"><b>${esc(b.kind)}</b></span>
     <div class="stmt">${esc(b.statement)||"—"}</div>
     ${b.rationale?`<div class="rationale">${esc(b.rationale)}</div>`:""}
     ${b.counter_evidence?`<div class="kv"><b>counter-evidence:</b> ${esc(b.counter_evidence)}</div>`:""}
     ${conf(b.confidence)}`, true), arrow());

  // Verifier
  const v=r.verifier, vk=verdictOf(r);
  let vbody;
  if(!v){ vbody = '<div class="note">Verifier not run (the Builder proposed NO_OP — nothing to verify).</div>'; }
  else if(v.status==="ERROR"){ vbody = `<span class="verdictbig REJECT">ERROR</span>
     <div class="rationale">Execution failure — <b>not</b> a semantic verdict. ${esc(v.error_reason)}</div>`; }
  else { vbody = `<span class="verdictbig ${v.decision}">${v.decision}</span>
     ${v.rationale?`<div class="rationale">${esc(v.rationale)}</div>`:""}${conf(v.confidence)}`; }
  m.append(stage("Verifier", "should this become long-term knowledge?", vbody, true), arrow());

  // Engine
  const e=r.engine;
  m.append(stage("Engine", "what actually changed",
    `<span class="op">${esc(e.operation)}</span>
     ${e.version?`<span class="kv"> committed <b>durable ${esc(e.identity)} v${e.version}</b></span>`:""}
     ${e.rejection_reason?`<div class="kv">${esc(e.rejection_reason)}</div>`:""}`, true), arrow());

  // Outcome / provenance
  if(r.committed){
    m.append(el("div","outcome yes",
      `✓ Durable memory created (v${e.version}). Traceable to its evidence: ${r.evidence.map(x=>esc(x.label)).join(" · ")}
       <div class="note">→ each semantic record traces one more hop to its Source passage.</div>`));
  } else {
    m.append(el("div","outcome no", `∅ No durable memory created — ${esc(e.operation)}.`));
  }
}

// sidebar
const list = document.getElementById("list");
R.forEach((r,i)=>{
  const vk = verdictOf(r);
  const b = el("button","item"+(i===0?" active":""));
  b.append(el("span","pill "+(vk==="ERROR"?"REJECT":vk), vk==="NONE"?"—":vk));
  b.append(el("span",null,`<div class="s">${esc(r.builder.statement||"(builder NO_OP)").slice(0,80)}</div><div class="d">${esc(r.domain_title)}</div>`));
  b.onclick=()=>{document.querySelectorAll(".item").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(r);};
  list.append(b);
});
if(R.length) render(R[0]); else document.getElementById("main").innerHTML='<p class="note">No records. Run <code>python explorer/build_data.py</code>.</p>';
</script>
</body>
</html>
